    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'correct') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.3);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(110, now + 0.3);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'tick') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
      } else if (type === 'win') {
        const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
        notes.forEach((freq, i) => {
          const noteOsc = audioCtx.createOscillator();
          const noteGain = audioCtx.createGain();
          noteOsc.connect(noteGain);
          noteGain.connect(audioCtx.destination);
          noteOsc.frequency.setValueAtTime(freq, now + i * 0.1);
          noteGain.gain.setValueAtTime(0.2, now + i * 0.1);
          noteGain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.2);
          noteOsc.start(now + i * 0.1);
          noteOsc.stop(now + i * 0.1 + 0.2);
        });
      }
    }

    function speakQuestion(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'fr-FR';
        utterance.pitch = 1.6;
        utterance.rate = 1.0;

        const voices = window.speechSynthesis.getVoices();
        const frVoice = voices.find(v => v.lang.includes('fr'));
        if (frVoice) {
          utterance.voice = frVoice;
        }

        window.speechSynthesis.speak(utterance);
      }
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();

                <span class="text-xs font-black uppercase tracking-wider">Meilleur Score :</span>
                <span class="text-lg font-black text-yellow-200">${highScore} pts</span>
              </div>
              
              <div class="mt-2">
                <button onclick="resetHighScore()" class="text-xs font-bold bg-white/10 hover:bg-white/20 text-white px-3 py-1 rounded-xl border border-white/20 transition active:scale-95">
                  🔄 Réinitialiser le score
                </button>
              </div>
            </div>

            <div class="bg-white/80 backdrop-blur border-4 border-amber-300 rounded-3xl p-4 text-left space-y-2 shadow-md">
              <h2 class="font-extrabold text-amber-900 flex items-center gap-1 text-sm">
                ⏱️ Temps par question :
              </h2>
              <div class="grid grid-cols-3 gap-2">
                ${[30, 60, 90].map(t => `
                  <button onclick="setTimeLimit(${t})" 
                    class="py-2 rounded-xl font-black text-xs border-2 transition active:scale-95 ${selectedTimeLimit === t ? 'bg-amber-500 text-white border-amber-600' : 'bg-white text-amber-900 border-amber-200 hover:bg-amber-50'}">
                    ⏱️ ${t} sec
                  </button>
                `).join('')}
              </div>
            </div>

            <div class="bg-white/80 backdrop-blur border-4 border-amber-300 rounded-3xl p-4 text-left space-y-3 shadow-md">
              <h2 class="font-extrabold text-amber-900 flex items-center gap-1 text-lg">
                🎯 Choisis ton défi :
              </h2>
              <div class="grid grid-cols-1 gap-2">
                ${categoriesList.map(cat => {
                  const count = cat === 'Toutes' 
                    ? questionsData.length 
                    : questionsData.filter(q => q.category === cat).length;
                  const isSelected = selectedCategoryFilter === cat;
                  const activeClass = isSelected 
                    ? 'bg-amber-500 text-white border-amber-600 scale-[1.02]' 
                    : 'bg-white text-amber-900 border-amber-200 hover:bg-amber-50';
                  
                  return `
                    <button onclick="filterByCategory('${cat.replace(/'/g, "\\'")}')" 
                      class="border-2 rounded-2xl p-3 flex items-center justify-between font-extrabold shadow transition transform active:scale-95 ${activeClass}">
                      <span>${cat === 'Toutes' ? '🌟 Toutes les épreuves' : '📘 ' + cat}</span>
                      <span class="${isSelected ? 'bg-amber-700 text-white' : 'bg-amber-100 text-amber-800'} text-xs px-2.5 py-1 rounded-full">${count}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <button onclick="startQuiz()" class="w-full bg-gradient-to-r from-emerald-400 to-green-500 hover:from-emerald-500 hover:to-green-600 text-white font-black text-2xl py-4 rounded-3xl shadow-lg border-b-4 border-green-700 transform active:scale-95 transition flex items-center justify-center gap-2">
              <span>C'EST PARTI !</span> 🚀
            </button>
            <p class="text-amber-900 text-xs font-bold">⭐ ${activeQuestions.length} questions prêtes à être jouées !</p>
          </div>
        `;
      } 
      else if (currentState === 'QUIZ') {
        const q = activeQuestions[currentQuestionIndex];
        const level = Math.floor(currentQuestionIndex / 5) + 1;

        app.innerHTML = `
          <div class="space-y-3 pop-in">
            <div class="bg-white/80 backdrop-blur border-2 border-amber-300 rounded-2xl p-3 shadow-md flex justify-between items-center text-amber-900 font-extrabold text-sm">
              <button onclick="goWelcome()" class="text-xs bg-amber-100 px-3 py-1.5 rounded-xl border border-amber-300 hover:bg-amber-200">🏠 Menu</button>
              <div class="flex items-center gap-2">
                <span class="bg-orange-100 text-orange-900 px-2.5 py-1 rounded-xl border border-orange-300 text-xs">Niv. ${level}</span>
                <span class="bg-amber-100 text-amber-800 px-3 py-1 rounded-xl border border-amber-300">⭐ ${score} pts</span>
                ${streak > 1 ? `<span class="bg-orange-500 text-white px-2 py-0.5 rounded-full text-xs animate-bounce">🔥 x${streak}</span>` : ''}
              </div>
            </div>

            <div class="bg-amber-100 border-2 border-amber-300 h-6 rounded-full overflow-hidden p-0.5 relative shadow-inner">
              <div id="timer-bar" class="h-full bg-gradient-to-r from-amber-400 to-orange-500 rounded-full transition-all duration-1000" style="width: 100%;"></div>
              <span id="timer-text" class="absolute inset-0 flex items-center justify-center text-xs font-black text-amber-900 drop-shadow-sm">${timer}s</span>
            </div>

            <div class="bg-white border-4 border-amber-300 rounded-3xl p-5 shadow-xl relative">
              <div class="flex justify-between items-center mb-2">
                <span class="bg-amber-100 text-amber-800 font-extrabold text-xs px-3 py-1 rounded-full border border-amber-200">
                  📂 ${q.category}
                </span>
                <span class="text-xs font-black text-slate-400">${currentQuestionIndex + 1} / ${activeQuestions.length}</span>
              </div>

              <div class="flex items-center gap-3 my-3">
                <button onclick="speakQuestion('${q.question.replace(/'/g, "\\'")}')" class="bg-amber-100 hover:bg-amber-200 p-2.5 rounded-2xl text-3xl flex-shrink-0 animate-bounce-short cursor-pointer transition" title="Écouter la question">
                  👧
                </button>
                <h2 class="text-base font-extrabold text-slate-800 leading-snug">${q.question}</h2>
              </div>

              <div class="space-y-2 mt-4">
                ${q.options.map((opt, idx) => {
                  let btnStyle = "bg-amber-50/50 border-2 border-amber-200 text-slate-700 hover:border-amber-400 hover:bg-amber-100/50";
                  if (isAnswered) {
                    if (idx === q.correctIndex) {
                      btnStyle = "bg-emerald-100 border-4 border-emerald-500 text-emerald-900 font-black scale-[1.02]";
                    } else if (selectedOption === idx) {
                      btnStyle = "bg-rose-100 border-4 border-rose-500 text-rose-900 font-black";
                    } else {
                      btnStyle = "bg-slate-50 border-2 border-slate-200 text-slate-400 opacity-60";
                    }
                  }
                  return `
                    <button 
                      onclick="checkAnswer(${idx})" 
                      ${isAnswered ? 'disabled' : ''}
                      class="w-full text-left p-3.5 rounded-2xl flex justify-between items-center font-bold text-sm transition transform active:scale-95 shadow-sm ${btnStyle}">
                      <span>${opt}</span>
                      <span class="w-7 h-7 rounded-xl bg-white border-2 border-amber-300 text-amber-800 text-xs font-black flex items-center justify-center flex-shrink-0 ml-2 shadow-xs">${idx + 1}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            ${isAnswered ? `
              <div class="bg-white border-4 ${isCorrect ? 'border-emerald-400' : 'border-rose-400'} rounded-3xl p-4 space-y-3 shadow-xl pop-in">
                ${isCorrect ? `
                  <div class="text-emerald-600 font-black text-xl flex items-center gap-2">
                    <span>🎉 BRAVO ! (+10 pts)</span>
                  </div>
                ` : `
                  <div class="text-rose-500 font-black text-xl flex items-center gap-2">
                    <span>Oups ! ${selectedOption === -1 ? '⏰ Temps écoulé !' : '❌ Dommage !'}</span>
                  </div>
                  <div class="bg-amber-50 border-2 border-amber-200 p-2.5 rounded-2xl text-xs text-amber-900 font-bold">
                    💡 La bonne réponse : <span class="underline">${q.options[q.correctIndex]}</span>
                  </div>
                `}
                <button onclick="nextQuestion()" class="w-full bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-white font-black text-lg py-3 rounded-2xl shadow-lg border-b-4 border-orange-700 transform active:scale-95 transition flex items-center justify-center gap-2">
                  <span>Question Suivante</span> ➡
                </button>
              </div>
            ` : ''}
          </div>
        `;

        if (!isAnswered) {
          startTimer();
          speakQuestion(q.question);
        }
      }
      else if (currentState === 'END') {
        const total = activeQuestions.length;
        const percentage = Math.round((score / (total * 10)) * 100);
        
        let badge = "🌟 Apprenti des Mots";
        let stars = "⭐";
        if (percentage >= 80) {
          badge = "🏆 SUPER CHAMPION DU FRANÇAIS !";
          stars = "⭐⭐⭐";
        } else if (percentage >= 50) {
          badge = "🥇 Grand Explorateur !";
          stars = "⭐⭐";
        }

        app.innerHTML = `
          <div class="bg-white border-4 border-amber-300 rounded-3xl p-6 text-center space-y-4 shadow-2xl pop-in">
            <div class="text-6xl animate-bounce">${stars}</div>
            <h1 class="text-3xl font-black text-amber-900">MISSION ACCOMPLIE !</h1>
            
            <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-4 space-y-2">
              <p class="text-amber-800 font-extrabold text-sm">${badge}</p>
              <div class="text-4xl font-black text-amber-600">${score} <span class="text-base text-amber-800">pts</span></div>
              <p class="text-xs text-slate-500 font-bold">Record de combo : 🔥 x${maxStreak}</p>
            </div>

            <button onclick="goWelcome()" class="w-full bg-gradient-to-r from-emerald-400 to-green-500 hover:from-emerald-500 hover:to-green-600 text-white font-black text-xl py-4 rounded-3xl shadow-lg border-b-4 border-green-700 transform active:scale-95 transition">
              🔄 Rejouer une partie !
            </button>
          </div>
        `;
      }
    }

    // -------------------------------------------------------------
    // 6. LOGIQUE D'INTERACTION
    // -------------------------------------------------------------
    function startQuiz() {
      currentState = 'QUIZ';
      currentQuestionIndex = 0;
      score = 0;
      streak = 0;
      maxStreak = 0;
      isAnswered = false;
      render();
    }

    function goWelcome() {
      clearInterval(timerInterval);
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      currentState = 'WELCOME';
      render();
    }

    function checkAnswer(index) {
      if (isAnswered) return;
      clearInterval(timerInterval);
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();

      selectedOption = index;
      isAnswered = true;

      const q = activeQuestions[currentQuestionIndex];
      isCorrect = (index === q.correctIndex);

      if (isCorrect) {
        streak++;
        if (streak > maxStreak) maxStreak = streak;
        score += 10 + (streak > 1 ? streak * 2 : 0);
        
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('quiz_high_score', highScore);
        }

        playSound('correct');
        confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
      } else {
        streak = 0;
        playSound('wrong');
      }

      render();
    }

    function nextQuestion() {
      if (currentQuestionIndex + 1 < activeQuestions.length) {
        currentQuestionIndex++;
        isAnswered = false;
        selectedOption = null;
        render();
      } else {
        currentState = 'END';
        playSound('win');
        confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } });
        render();
      }
    }

    render();
  </script>
</body>
</html>
